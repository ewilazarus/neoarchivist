[package]
name = "neoarchivist"
version = "0.1.0"
edition = "2024"
description = "Keeps a project's docs/ Obsidian vault behind one agent, and the tools that agent uses."
repository = "https://github.com/ewilazarus/neoarchivist"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
jiff = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
